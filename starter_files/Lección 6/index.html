<!DOCTYPE html>
<!-- Indica que el documento utiliza HTML5 -->

<html>
<!-- Elemento raíz de la página -->

<head>
    <!-- Contiene información y configuración del documento -->
    <title>Mi primera página web</title>
    <!-- Texto que aparece en la pestaña del navegador -->

    <style>
        /* Estilos CSS aplicados a los elementos de la página */
        body {
            /* Error de ejemplo: el fondo y el texto son blancos, por lo que cuesta leerlo */
            background-color: white;
            color: white;
        }

        h1 {
            /* Define el tamaño del encabezado principal */
            font-size: 16px;
        }
    </style>
</head>
<body>
    <!-- Contenido visible de la página -->
    <h1>Bienvenidos a mi página</h1>
    <!-- Encabezado principal -->

    <!-- Error de ejemplo: la imagen no incluye el atributo alt descriptivo -->
    <img src="foto.jpg">

    <!-- Error de ejemplo: este párrafo no tiene una etiqueta de cierre </p> -->
    <p>Estoy aprendiendo desarrollo web.

    <!-- Enlace de ejemplo; el símbolo # no dirige a otra página -->
    <a href="#">Haz clic aquí</a>
</body>
</html>
